
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Verify app icon
        run: |
          ICON="$(find . -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) | head -n 1)"
          if [ -z "$ICON" ]; then
            echo "ERROR: No PNG or JPG app icon found in repository root."
            exit 1
          fi
          mkdir -p assets
          cp "$ICON" assets/icon.png
          echo "Using icon: $ICON"

      - name: Install Capacitor assets tool
        run: npm install --no-save @capacitor/assets

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons
        run: npx capacitor-assets generate --android

      - name: Sync Android project
        run: npx cap sync android

      - name: Set Android app label
        run: |
          FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "$FILE" ]; then
            sed -i 's/<string name="app_name">[^<]*<\/string>/<string name="app_name">مخزن ولاد شلبه<\/string>/' "$FILE"
          else
            mkdir -p android/app/src/main/res/values
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <string name="app_name">مخزن ولاد شلبه</string>' '</resources>' > "$FILE"
          fi

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: makhzan-owlad-shalba-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
