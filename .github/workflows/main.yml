name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www
          [ -f building-store.html ] && cp building-store.html www/index.html
          test -f www/index.html || { echo "ERROR: www/index.html not found"; exit 1; }
          test -f core.js || { echo "ERROR: core.js not found in repo root"; exit 1; }
          cp core.js www/core.js
          grep -q 'src="core.js"' www/index.html || sed -i 's#</body>#<script src="core.js"></script></body>#' www/index.html
      - name: Add Android platform
        run: '[ -d android ] || npx cap add android'
      - name: Add permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <application#' $M
          grep -q requestLegacyExternalStorage $M || sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' $M
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: makhzan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
