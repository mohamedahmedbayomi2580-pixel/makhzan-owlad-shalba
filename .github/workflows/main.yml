name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www
          [ -f building-store.html ] && cp building-store.html www/index.html
          test -f www/index.html || { echo "ERROR: www/index.html not found"; exit 1; }
      - name: Patch app (fix freeze + unlimited storage)
        run: |
          python3 - <<'PY'
          import re
          p='www/index.html'
          s=open(p,encoding='utf-8').read()
          print('LENGTH:',len(s),'| has </script>:','</script>' in s)
          def rep(a,b):
              global s
              if a in s:
                  s=s.replace(a,b,1); print('OK   :',a[:40])
              else:
                  print('SKIP :',a[:40])
          # salvage a truncated file: cut the incomplete last function
          truncated = '</script>' not in s
          if truncated:
              idx=s.rfind('/* --- كشف حساب العميل')
              if idx<0: idx=s.rfind('\nfunction ledger(')
              if idx>0:
                  s=s[:idx]; print('WARN : file was truncated, cut at',idx)
              else:
                  print('ERROR: truncated and cannot salvage'); raise SystemExit(1)
          rep('<script>','<script type="text/plain" id="main">')
          rep("String(s??'')","String(s==null?'':s)")
          rep("let db=JSON.parse(","let db=window.__DB||JSON.parse(")
          new_save="const save=()=>{if(IDB){try{IDB.transaction('kv','readwrite').objectStore('kv').put(db,'db');return}catch(e){}}try{L.setItem('db',JSON.stringify(db))}catch(e){}};"
          m=re.search(r"const save=\(\)=>\{.*?\};?\n",s,re.S)
          if m:
              s=s[:m.start()]+new_save+"\n"+s[m.end():]; print('OK   : save replaced')
          else:
              print('SKIP : save not found')
          override="""
          doRestore=function(){const d=_rs,nd={t:'dark',hold:[],rsv:[],seq:1,sh:0,...d};nd.shop={n:NAME,ph:'',vat:0,low:10,...d.shop};nd.tpl=d.tpl||{paper:'80',font:'Tahoma',head:'',foot:'',terms:'',logo:''};nd.lastBk=today();
          ['hold','rsv'].forEach(k=>{if(!Array.isArray(nd[k]))nd[k]=[]});let mx=0;[nd.prods,nd.cust,nd.sup,nd.inv,nd.pay,nd.ret,nd.rsv].forEach(a=>a.forEach(x=>{mx=Math.max(mx,+x.id||0)}));nd.seq=Math.max(+nd.seq||1,mx+1);
          const tx=IDB.transaction('kv','readwrite');tx.objectStore('kv').put(nd,'db');
          tx.oncomplete=()=>{db=nd;ok=0;alert('تمت الاستعادة بنجاح');location.reload()};tx.onerror=()=>alert('تعذرت الاستعادة')};
          """
          loader="""
          <script>
          var IDB=null;
          (function(){
           function boot(){var x=document.createElement('script');x.textContent=document.getElementById('main').textContent;document.body.appendChild(x)}
           try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
           try{
            var r=indexedDB.open('shalaba',1);
            r.onupgradeneeded=function(){r.result.createObjectStore('kv')};
            r.onsuccess=function(){IDB=r.result;var g=IDB.transaction('kv').objectStore('kv').get('db');
             g.onsuccess=function(){window.__DB=g.result||null;boot()};g.onerror=boot};
            r.onerror=boot;
           }catch(e){boot()}
          })();
          </script>
          """
          if truncated:
              s=s+"\n"+override+"</script>"+loader+"</body></html>"
          else:
              i=s.rindex('</script>')
              s=s[:i]+override+'</script>'+loader+s[i+9:]
          catcher="""<script>addEventListener('error',function(e){var d=document.createElement('pre');d.style.cssText='position:fixed;z-index:99999;top:20px;left:8px;right:8px;background:#7f1d1d;color:#fff;padding:10px;font:12px monospace;white-space:pre-wrap;direction:ltr';d.textContent='ERR: '+e.message+' line '+e.lineno;document.body.appendChild(d)});</script>"""
          rep('<body>','<body>'+catcher)
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Add Android platform
        run: '[ -d android ] || npx cap add android'
      - name: Add permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <application#' $M
          grep -q requestLegacyExternalStorage $M || sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' $M
      - name: Add camera permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q permission.CAMERA $M || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application#' $M
      - name: Large heap
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q largeHeap $M || sed -i 's#<application#<application android:largeHeap="true"#' $M
      - name: Apply app icon
        run: |
          ICON=""
          for f in assets/icon-only.png assets/icon.png resources/icon.png icon.png; do
            if [ -f "$f" ]; then ICON="$f"; break; fi
          done
          if [ -z "$ICON" ]; then echo "No icon file found - default icon will be used"; exit 0; fi
          sudo apt-get install -y imagemagick > /dev/null
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for s in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${s%%:*}; z=${s##*:}
            mkdir -p $R/mipmap-$d
            convert "$ICON" -resize ${z}x${z} $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
          done
      - name: Fixed signing key
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; else echo "WARNING: debug.keystore missing - APK signature changes every build"; fi
      - name: Bump version
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" $G
          sed -i "s/versionName \"[^\"]*\"/versionName \"2.${{ github.run_number }}\"/" $G
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: makhzan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
