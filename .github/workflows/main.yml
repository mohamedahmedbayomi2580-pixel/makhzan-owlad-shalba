
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Prepare app icon
        run: |
          ICON="$(find . -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) | head -n 1)"
          if [ -z "$ICON" ]; then
            echo "ERROR: App icon image not found in repository root."
            exit 1
          fi
          mkdir -p assets
          cp "$ICON" assets/icon.png

      - name: Install Capacitor assets
        run: npm install --no-save @capacitor/assets

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons
        run: npx capacitor-assets generate --android

      - name: Sync Android project
        run: npx cap sync android

      - name: Add notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")

          permissions = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
          ]

          for permission in permissions:
              if permission not in s:
                  entry = (
                      f'    <uses-permission android:name="{permission}" />\n'
                  )
                  s = s.replace("<application", entry + "<application", 1)

          p.write_text(s, encoding="utf-8")
          print("Notification permissions configured.")
          PY

      - name: Set app name
        run: |
          FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "$FILE" ]; then
            sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">مخزن ولاد شلبه</string>#' "$FILE"
          fi

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: makhzan-owlad-shalba-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
