<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مخزن اولاد شلبه</title>
<style>
:root{--pg:#0b1f3a;--pt:#fff;--cd:#fff;--bd:#d1d5db;--tx:#1f2937;--mu:#6b7280;--ac:#f59e0b;--rd:#dc2626;--gn:#16a34a}
[data-t=light]{--pg:#eef2f7;--pt:#0b1f3a}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--pg);color:var(--pt);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#lg{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#0b1f3a;color:#fff;gap:14px}
#lg .fm{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#app{display:none;padding:12px 12px 84px;max-width:720px;margin:auto}
.cd{background:var(--cd);color:var(--tx);border:1.5px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.cd h3{margin:0 0 10px;font-size:16px;color:#0b1f3a}
input,select{width:100%;padding:11px 12px;margin:0 0 8px;background:#fff;color:var(--tx);border:1.5px solid var(--bd);border-radius:10px;font:inherit}
input:focus,select:focus{outline:2px solid #93c5fd}
.b{background:#0b1f3a;color:#fff;border:0;border-radius:10px;padding:11px 14px;font:inherit;cursor:pointer;width:100%;margin-bottom:6px}
.b.s{width:auto;padding:6px 10px;margin:0;font-size:13px}.b.r{background:var(--rd)}.b.a{background:var(--ac);color:#111}.b.g{background:#e5e7eb;color:#111}.b.n{background:var(--gn)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eef0f3;font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.mu{color:var(--mu);font-size:13px;margin:4px 0}.low{color:var(--rd);font-weight:700}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;background:#fee2e2;color:#991b1b}
.ro{background:#fef3c7;border:1.5px solid #f59e0b;border-radius:12px;padding:10px;margin-bottom:12px;color:#78350f;font-weight:700}
nav{position:fixed;bottom:0;right:0;left:0;display:flex;background:#0b1f3a;border-top:1.5px solid #3b4a63;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;color:#9fb3d1;font:inherit;font-size:11px;padding:4px 0;cursor:pointer}
nav button span{display:block;font-size:20px}nav button.on{color:var(--ac)}
#md .mb{position:fixed;inset:0;background:rgba(0,0,0,.6);overflow:auto;padding:14px;z-index:9}
#md .cd{max-width:520px;margin:auto}
pre{white-space:pre-wrap;font:inherit;margin:0}
@media print{body *{visibility:hidden}#rc,#rc *{visibility:visible}#rc{position:absolute;inset:0}.np{display:none!important}}
</style></head><body>

<div id="lg">
<svg width="130" height="110" viewBox="0 0 130 110" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<path d="M18 100h94"/><rect x="22" y="48" width="30" height="52" fill="#13305c"/><rect x="56" y="64" width="26" height="36" fill="#13305c"/>
<path d="M30 58h4M40 58h4M30 70h4M40 70h4M30 82h4M40 82h4M62 74h4M72 74h4M62 86h4M72 86h4" stroke="#fff" stroke-width="3"/>
<path d="M96 100V14M96 14h-60M96 14l22 14M96 24l-40-10M48 14v22M48 36v4" /><path d="M44 40h8v6h-8z" fill="#f59e0b"/></svg>
<h2 style="margin:0">مخزن اولاد شلبه</h2>
<div class="fm"><input id="lu" placeholder="اسم المستخدم" autocomplete="off"><input id="lp" type="password" placeholder="كلمة السر">
<button class="b a" onclick="login()">تسجيل الدخول</button><div id="le" style="color:#fca5a5;text-align:center"></div></div></div>

<div id="app"><div class="row" style="border:0"><b id="hn"></b><button class="b s g" onclick="logout()">خروج</button></div><div id="c"></div></div>
<nav id="nv" style="display:none">
<button data-v="cash" onclick="go('cash')"><span>🛒</span>الكاشير</button>
<button data-v="inv" onclick="go('inv')"><span>📦</span>المخزن</button>
<button data-v="acc" onclick="go('acc')"><span>👥</span>الحسابات</button>
<button data-v="rep" onclick="go('rep')"><span>📊</span>التقارير</button>
<button data-v="res" onclick="go('res')"><span>♻️</span>استعادة</button>
<button data-v="set" onclick="go('set')"><span>⚙️</span>الإعدادات</button></nav>
<div id="md"></div>

<script>
const $=s=>document.querySelector(s),L=localStorage;
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>fmt(new Date()),nextDay=s=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+1);return fmt(d)};
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
let db=JSON.parse(L.getItem('db')||'null')||{u:'admin',p:'123456789',t:'dark',shop:{n:'مخزن اولاد شلبه',ph:'',vat:0,low:10},prods:[],cust:[],sup:[],inv:[],pay:[],ret:[],hold:[],seq:1,lastBk:today(),sh:0};
const save=()=>{const s=JSON.stringify(db);try{L.setItem('db',s)}catch(e){Object.keys(L).filter(k=>k.startsWith('bk_')||k=='db_prev').forEach(k=>L.removeItem(k));L.setItem('db',s)}};
const val=id=>$('#'+id).value;
let V='cash',cart=[],cf,ps='',rg=0,rd=today(),hq='',sb='c',rv=null,ok=0;
const newCf=()=>cf={c:'',t:'cash',dt:'p',dv:0,fee:0,site:'',pd:0};newCf();
const cust=id=>db.cust.find(c=>c.id==id),prod=id=>db.prods.find(p=>p.id==id);
const card=(t,b)=>`<section class="cd"><h3>${t}</h3>${b}</section>`;

/* ===== دخول ===== */
function login(){if(val('lu')==db.u&&val('lp')==db.p){ok=1;$('#lg').style.display='none';$('#app').style.display='block';$('#nv').style.display='flex';$('#hn').textContent=db.shop.n;go('cash');perm();sched(1)}else $('#le').textContent='اسم المستخدم أو كلمة السر غير صحيحة'}
function logout(){ok=0;rg=0;location.reload()}
function go(v){V=v;render()}
function render(){document.documentElement.dataset.t=db.t;
$('#c').innerHTML={cash:vCash,inv:vInv,acc:vAcc,rep:vRep,res:vRes,set:vSet}[V]();
if(V=='cash'){uo();upd()}
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==V))}
function modal(h){$('#md').innerHTML=`<div class="mb"><div class="cd" id="rc">${h}<button class="b g np" onclick="cl()">إغلاق</button></div></div>`}
const cl=()=>$('#md').innerHTML='';
function share(t){if(navigator.share)navigator.share({text:t}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(t);alert('تم نسخ النص')}}
function txt(t,body){window._t=t+'\n'+body;modal(`<h3>${t}</h3><pre>${E(body)}</pre><div class="g2 np" style="margin-top:10px"><button class="b" onclick="print()">🖨️ طباعة / PDF</button><button class="b n" onclick="share(_t)">مشاركة</button></div>`)}

/* ===== الكاشير ===== */
function vCash(){
const op=db.prods.map(p=>`<option value="${p.id}">${E(p.n)} — متاح ${p.qty-(p.res||0)}</option>`).join('');
const r=cart.map((x,i)=>`<div class="row"><span>${E(x.n)} × ${x.q} ${E(x.u)}</span><b>${m(x.q*x.pr)}</b><button class="b s r" onclick="cart.splice(${i},1);render()">✕</button></div>`).join('')||'<p class="mu">لا توجد أصناف. أضف صنفاً للبدء.</p>';
const cu=db.cust.map(c=>`<option value="${c.id}" ${cf.c==c.id?'selected':''}>${E(c.n)}</option>`).join('');
return card('🛒 إضافة صنف',`<select id="ps" onchange="uo()">${op}</select><div class="g2"><select id="us"></select><input id="q" type="number" step="any" value="1"></div><input id="up" type="number" min="0" step="any" placeholder="سعر الوحدة (يكتبه الكاشير)"><button class="b" onclick="addC()">إضافة للفاتورة</button>`)
+card('🧾 الفاتورة الحالية',r+'<div id="tt"></div>')
+card('📝 تفاصيل الفاتورة',`<div class="g2"><select onchange="cf.t=this.value;upd()"><option value="cash">نقدي</option><option value="credit" ${cf.t=='credit'?'selected':''}>آجل</option></select>
<select onchange="cf.c=this.value;cf.ph=(cust(this.value)||{}).ph||cf.ph||'';render()"><option value="">— العميل / المقاول —</option>${cu}</select></div>
<div class="g2"><input type="number" placeholder="الخصم" value="${cf.dv||''}" onchange="cf.dv=+this.value;upd()"><select onchange="cf.dt=this.value;upd()"><option value="p">نسبة %</option><option value="f" ${cf.dt=='f'?'selected':''}>مبلغ ثابت</option></select></div>
<div class="g2"><input type="number" placeholder="أجرة النقل والعتالة" value="${cf.fee||''}" onchange="cf.fee=+this.value;upd()"><input type="number" placeholder="المدفوع (للآجل)" value="${cf.pd||''}" onchange="cf.pd=+this.value"></div>
<input placeholder="موقع البناء" value="${E(cf.site)}" onchange="cf.site=this.value"><div class="mu">تاريخ السداد المخطط (للآجل)</div><input type="date" value="${cf.due||''}" onchange="cf.due=this.value">
<input type="tel" placeholder="رقم هاتف العميل (إلزامي)" value="${E(cf.ph||'')}" onchange="cf.ph=this.value"><select onchange="cf.m=this.value"><option value="cash">الدفع: كاش</option><option value="visa" ${cf.m=='visa'?'selected':''}>فيزا</option><option value="net" ${cf.m=='net'?'selected':''}>الشبكة الإلكترونية</option><option value="wallet" ${cf.m=='wallet'?'selected':''}>محفظة رقمية</option></select><button class="b n" onclick="fin()" style="padding:15px;font-size:16px">✅ إنشاء فاتورة / تأكيد البيع</button>
<div class="g2"><button class="b a" onclick="hold()">⏸ تعليق الفاتورة</button><button class="b g" onclick="showHold()">المعلّقة (${db.hold.length})</button></div>`)}
function uo(){const p=prod(val('ps')||0),s=$('#us');if(s)s.innerHTML=p?p.units.map((u,i)=>`<option value="${i}">${E(u.n)} — ${m(p.price*u.f)}</option>`).join(''):''}
function calc(){const s=sum(cart,x=>x.q*x.pr),d=cf.dt=='p'?s*cf.dv/100:+cf.dv||0,v=(s-d)*(db.shop.vat||0)/100;return{s,d,v,t:s-d+v+(+cf.fee||0)}}
function upd(){const k=calc(),e=$('#tt');if(e)e.innerHTML=`<div class="row"><span>المجموع</span><b>${m(k.s)}</b></div><div class="row"><span>الخصم</span><b>${m(k.d)}</b></div><div class="row"><span>الضريبة</span><b>${m(k.v)}</b></div><div class="row"><span>النقل</span><b>${m(cf.fee)}</b></div><div class="row"><b>الإجمالي</b><b style="font-size:18px">${m(k.t)}</b></div>`}
function addC(){const p=prod(val('ps'));if(!p)return alert('أضف منتجات من المخزن أولاً');const u=p.units[val('us')],q=+val('q');if(!(q>0))return alert('أدخل كمية صحيحة');
const inCart=sum(cart.filter(x=>x.pid==p.id),x=>x.q*x.f);if((inCart+q*u.f)>p.qty-(p.res||0))return alert('الكمية المتاحة غير كافية');
cart.push({pid:p.id,n:p.n,u:u.n,f:u.f,q,pr:p.price*u.f});render()}
function fin(){if(!cart.length)return alert('الفاتورة فارغة');if(cf.t=='credit'&&!cf.c)return alert('اختر العميل للفاتورة الآجلة');
const k=calc();cart.forEach(x=>prod(x.pid).qty-=x.q*x.f);
const i={id:db.seq++,ts:Date.now(),day:today(),c:cf.c,t:cf.t,items:cart.map(x=>({...x,r:0})),s:k.s,d:k.d,v:k.v,fee:+cf.fee||0,tot:k.t,paid:cf.t=='cash'?k.t:(+cf.pd||0),site:cf.site};
if(cf.t=='credit')cust(cf.c).bal+=i.tot-i.paid;
db.inv.push(i);cart=[];newCf();save();showInv(i.id)}
function hold(){if(!cart.length)return;db.hold.push({cart,cf,ts:Date.now()});cart=[];newCf();save();render()}
function showHold(){modal('<h3>الفواتير المعلّقة</h3>'+(db.hold.map((h,i)=>`<div class="row"><span>${new Date(h.ts).toLocaleTimeString('ar-EG')} — ${h.cart.length} صنف</span><button class="b s" onclick="cart=db.hold[${i}].cart;cf=db.hold[${i}].cf;db.hold.splice(${i},1);save();cl();render()">استرجاع</button></div>`).join('')||'<p class="mu">لا توجد فواتير معلّقة</p>'))}
function invText(i){const c=i.c?cust(i.c):null;return `${db.shop.n}\n${db.shop.ph}\nفاتورة رقم ${i.id} — ${i.day}\nالعميل: ${c?c.n:'نقدي'}${i.site?'\nالموقع: '+i.site:''}\n--------------\n`+i.items.map(x=>`${x.n} ${x.q} ${x.u} = ${m(x.q*x.pr)}`).join('\n')+`\n--------------\nالمجموع: ${m(i.s)}\nالخصم: ${m(i.d)}\nالضريبة: ${m(i.v)}\nالنقل: ${m(i.fee)}\nالإجمالي: ${m(i.tot)}\nالمدفوع: ${m(i.paid)}\nالمتبقي: ${m(i.tot-i.paid)}`}
function showInv(id){const i=db.inv.find(x=>x.id==id);window._t=invText(i);
modal(`<div id="rcp"><pre>${E(invText(i))}</pre></div><h3 class="np" style="margin-top:12px">إرجاع أصناف</h3>`+i.items.map((x,j)=>`<div class="row np"><span>${E(x.n)} (متبقي ${x.q-x.r})</span><input id="rq${j}" type="number" step="any" style="width:70px;margin:0"><button class="b s r" onclick="ret(${i.id},${j})">إرجاع</button></div>`).join('')+`<div class="g2 np" style="margin-top:10px"><button class="b" onclick="print()">🖨️ طباعة / PDF</button><button class="b n" onclick="share(_t)">مشاركة</button></div>`)}
function ret(id,j){const i=db.inv.find(x=>x.id==id),x=i.items[j],q=+val('rq'+j);if(!(q>0)||q>x.q-x.r)return alert('كمية غير صحيحة');
x.r+=q;prod(x.pid).qty+=q*x.f;const a=q*x.pr;db.ret.push({id:db.seq++,ts:Date.now(),day:today(),inv:id,n:x.n,q,amt:a,t:i.t});
if(i.t=='credit'&&i.c)cust(i.c).bal-=a;save();showInv(id)}

/* ===== المخزن ===== */
function vInv(){const f=db.prods.filter(p=>(p.n+' '+p.cat).includes(ps));
const rows=f.map(p=>{const lo=p.qty<=db.shop.low;return `<div class="cd" style="margin:0 0 8px;padding:10px"><div class="row" style="border:0"><b>${E(p.n)}</b><span class="mu">${E(p.cat)} ${p.bc?'| '+E(p.bc):''}</span></div>
<div class="${lo?'low':''}">الرصيد الفعلي: ${m(p.qty)} ${E(p.units[0].n)} ${lo?'<span class="tag">قارب على النفاد</span>':''}</div><div class="mu">محجوز: ${m(p.res||0)} | المتاح: <b class="${p.qty-(p.res||0)<0?'low':''}">${m(p.qty-(p.res||0))}</b> ${p.qty-(p.res||0)<0?`<button class="b s r" onclick="why(${p.id})">🛑</button>`:''}</div>
<div class="g3" style="margin-top:6px"><input id="pp${p.id}" type="number" value="${p.price}" title="السعر"><input id="pq${p.id}" type="number" value="${p.qty}" title="الكمية"><input id="pr${p.id}" disabled type="number" value="${p.res||0}" title="محجوز"></div>
<div class="mu">السعر | الكمية | المحجوز</div><div class="g2"><button class="b s" onclick="updP(${p.id})">تحديث</button><button class="b s r" onclick="delP(${p.id})">حذف</button></div></div>`}).join('')||'<p class="mu">لا توجد منتجات</p>';
return card('➕ إضافة منتج جديد',`<input id="an" placeholder="اسم المنتج"><div class="g2"><input id="ac" placeholder="التصنيف (حديد، أسمنت...)"><input id="ab" placeholder="الباركود"></div><div class="g2"><input id="ap" type="number" placeholder="سعر الوحدة الأساسية"><input id="aq" type="number" placeholder="الكمية الابتدائية"></div><div class="g2"><input id="au" placeholder="الوحدة الأساسية (شكارة)"><input id="ax" placeholder="وحدات أخرى (طن:20, نقلة:30)"></div><button class="b n" onclick="addP()">حفظ المنتج</button>`)
+card('📦 رصيد المخزن',`<button class="b a" onclick="rsvDash()">📋 عرض الحجوزات</button><input placeholder="بحث بالاسم أو التصنيف" value="${E(ps)}" onchange="ps=this.value;render()">${rows}`)}
function addP(){const n=val('an').trim();if(!n)return alert('أدخل اسم المنتج');
const u=[{n:val('au')||'وحدة',f:1}];val('ax').split(',').forEach(s=>{const[a,b]=s.split(':');if(a&&a.trim())u.push({n:a.trim(),f:+b||1})});
db.prods.push({id:db.seq++,n,cat:val('ac'),bc:val('ab'),price:+val('ap')||0,qty:+val('aq')||0,res:0,units:u});save();render()}
function updP(id){const p=prod(id);p.price=+val('pp'+id);p.qty=+val('pq'+id);p.res=+val('pr'+id);save();render()}
function delP(id){if(confirm('حذف المنتج؟')){db.prods=db.prods.filter(p=>p.id!=id);save();render()}}

/* ===== الحسابات ===== */
function vAcc(){const C=sb=='c',a=C?db.cust:db.sup;
const rows=a.map(x=>`<div class="cd" style="margin:0 0 8px;padding:10px"><div class="row" style="border:0"><b>${E(x.n)}</b>${C?`<button class="b s g" onclick="notes(${x.id})">📝 ملاحظات${(x.notes||[]).length?' ('+x.notes.length+')':''}</button><button class="b s g" onclick="rsvDash(${x.id})">📦 حجوزات</button>`:''}<span class="mu">${E(x.ph)} ${E(x.ad||'')}</span></div>${C?cSum(x):`<div class="${x.bal>0?'low':''}">المستحق له: ${m(x.bal)}</div>`}
<input id="am${x.id}" type="number" placeholder="المبلغ" style="margin-top:6px">${C?`<div class="g2"><button class="b s n" onclick="collect(${x.id})">📥 تحصيل دفعة</button><button class="b s" onclick="ledger(${x.id})">كشف الحساب</button></div><button class="b s a" style="width:100%;margin-top:6px" onclick="rsvForm(${x.id})">📌 حجز بضاعة فوري</button>`:`<div class="g2"><button class="b s" onclick="sup(${x.id},1)">فاتورة واردة</button><button class="b s n" onclick="sup(${x.id},-1)">سداد</button></div>`}</div>`).join('')||'<p class="mu">لا يوجد سجلات</p>';
return `<div class="g2" style="margin-bottom:12px"><button class="b ${C?'':'g'}" onclick="sb='c';render()">العملاء</button><button class="b ${C?'g':''}" onclick="sb='s';render()">الموردون</button></div>`
+card(C?'➕ عميل جديد':'➕ مورد جديد',`<input id="cn" placeholder="الاسم"><div class="g2"><input id="cp" placeholder="الهاتف"><input id="ca" placeholder="العنوان"></div><button class="b n" onclick="addA()">حفظ</button>`)+card(C?'👥 دليل العملاء':'🏭 الموردون',rows)}
function addA(){const n=val('cn').trim();if(!n)return;(sb=='c'?db.cust:db.sup).push({id:db.seq++,n,ph:val('cp'),ad:val('ca'),bal:0});save();render()}
function collect(id){const a=+val('am'+id),c=cust(id);if(!(a>0))return alert('أدخل المبلغ');c.bal-=a;db.pay.push({id:db.seq++,ts:Date.now(),day:today(),c:id,amt:a});save();
txt('وصل استلام',`${db.shop.n}\nالتاريخ: ${today()}\nاستلمنا من: ${c.n}\nمبلغ: ${m(a)}\nالمتبقي عليه: ${m(c.bal)}`);render()}
function sup(id,s){const a=+val('am'+id);if(!(a>0))return alert('أدخل المبلغ');db.sup.find(x=>x.id==id).bal+=s*a;save();render()}
function ledger(id){const c=cust(id),iv=db.inv.filter(i=>i.c==id).map(i=>`${i.day} | فاتورة ${i.id} | ${m(i.tot)} | مدفوع ${m(i.paid)}`),py=db.pay.filter(p=>p.c==id).map(p=>`${p.day} | دفعة | ${m(p.amt)}`);
txt('كشف حساب: '+c.n,'المسحوبات:\n'+(iv.join('\n')||'—')+'\n\nالمدفوعات:\n'+(py.join('\n')||'—')+'\n\nصافي الدين: '+m(c.bal))}

/* ===== التقارير ===== */

txt('إيصال عربون حجز',`${db.shop.n}\nالتاريخ: ${r.day}\nالعميل: ${cn(cid)}\nالمادة: ${p.n}\nالكمية: ${q} ${p.units[0].n}\nالسعر المقفول: ${m(+u)}\nالعربون: ${m(d)}\nينتهي الحجز: ${e}`)}
function dlv(id,cid){const r=db.rsv.find(x=>x.id==id),a=+val('dl'+id),p=prod(r.pid);if(!(a>0)||a>r.q-r.drawn)return alert('كمية غير صحيحة');
if(p){p.qty-=a;p.res=Math.max(0,(p.res||0)-a)}r.drawn+=a;
if(r.old){save();toast('تم تسجيل التوريد');return rsvDash(cid)}
const v=a*r.price,fd=Math.min(v,(r.dep||0)-(r.used||0)),rm=v-fd,c=cust(r.c);r.used=(r.used||0)+fd;c.bal+=rm;
const i={id:db.seq++,ts:Date.now(),day:today(),c:r.c,ph:c.ph||'',t:rm>0?'credit':'cash',m:r.m,items:[{pid:r.pid,n:p?p.n:'',u:p?p.units[0].n:'',f:1,q:a,pr:r.price,r:0,cost:p&&p.cost!=null?p.cost:null,rsvd:r.id}],s:v,d:0,v:0,fee:0,tot:v,paid:fd,rem:rm,k:1,site:'تسليم حجز'};
db.inv.push(i);save();sched();toast('تم التسليم وصدرت فاتورة المبيعات');showInv(i.id)}
function relExp(){let n=0;db.rsv.forEach(r=>{const l=r.q-r.drawn;if(l>0&&r.exp<today()){const p=prod(r.pid),c=cust(r.c),un=(r.dep||0)-(r.used||0);if(p)p.res=Math.max(0,(p.res||0)-l);if(un>0&&c)c.cr=(c.cr||0)+un;r.q=r.drawn;r.closed=1;
db.log.push({ts:Date.now(),k:'فك حجز تلقائي',t:`${cn(r.c)} — ${pn(r.pid)} × ${l}`+(un>0?` — العربون ${m(un)} صار رصيداً دائناً`:'')});n++}});if(n){save();sched();toast('تم فك '+n+' حجز منتهٍ تلقائياً وعادت الكمية للبيع','#d97706')}}

/* --- التنبيهات: قبل يوم + يوم الاستحقاق، وتُعاد جدولتها بعد أي سداد/فك --- */
function alerts(){const a=[];db.rsv.forEach(r=>{if(r.q>r.drawn)a.push({d:r.exp,w:'حجز '+pn(r.pid),c:cn(r.c),k:'r'})});db.cust.forEach(c=>{if(c.due&&c.bal>0)a.push({d:c.due,w:'مديونية '+m(c.bal),c:c.n,k:'d'})});return a}
const nm=(a,t)=>t?(a.k=='d'?`تنبيه استحقاق: اليوم هو موعد السداد المحدد للعميل ${a.c}`:`تنبيه: اليوم آخر يوم لحجز العميل ${a.c} (${a.w})`):`تنبيه: العميل ${a.c} لديه موعد ${a.k=='d'?'سداد مديونية':'انتهاء حجز'} غداً (${a.w})`;
async function sched(show){const A=alerts(),N=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications,t=today(),n=nextDay(t);
if(show===1){const l=A.filter(a=>a.d==t||a.d==n);if(l.length)modal('<h3>🔔 تنبيهات</h3>'+l.map(a=>`<div class="row">${E(nm(a,a.d==t))}</div>`).join(''))}
if(N){try{await N.requestPermissions();const p=await N.getPending();if(p.notifications.length)await N.cancel(p);let k=1;const L2=[];A.forEach(a=>{const d0=new Date(a.d+'T09:00').getTime();[[d0-864e5,0],[d0,1]].forEach(([at,s])=>L2.push({id:k++,title:db.shop.n,body:nm(a,s),schedule:{at:new Date(at),allowWhileIdle:true}}))});const f=L2.filter(z=>z.schedule.at>new Date());if(f.length)await N.schedule({notifications:f})}catch(e){}}}

/* --- حفظ السلة + الإقلاع مباشرة على الكاشير --- */
const _r2=render;render=function(){_r2();if(V=='cash'){db.cart=cart;db.cfd=cf;save()}};
document.addEventListener('visibilitychange',()=>{db.cart=cart;db.cfd=cf;save()});
if(db.cart&&db.cart.length){cart=db.cart;cf=db.cfd||cf}
ok=1;$('#lg').style.display='none';$('#app').style.display='block';$('#nv').style.display='flex';$('#hn').textContent=db.shop.n;const _lb=$('#app .row .b');if(_lb)_lb.style.display='none';
function uo(){const p=prod(val('ps')||0),s=$('#us');if(s)s.innerHTML=p?p.units.map((u,i)=>`<option value="${i}">${E(u.n)}</option>`).join(''):''}
function addC(){const p=prod(val('ps'));if(!p)return alert('أضف منتجات من المخزن أولاً');const u=p.units[val('us')],q=+val('q'),pr=val('up');if(!(q>0))return alert('أدخل كمية صحيحة');if(pr===''||+pr<0)return alert('اكتب سعر البيع للوحدة (لا يقل عن صفر)');
const inCart=sum(cart.filter(x=>x.pid==p.id),x=>x.q*x.f),after=p.qty-(p.res||0)-inCart-q*u.f;cart.push({pid:p.id,n:p.n,u:u.n,f:u.f,q,pr:+pr});render();
if(p.cost!=null&&+pr<p.cost*u.f)toast('تنبيه: سعر البيع أقل من التكلفة','#d97706');else if(after<0)toast('تنبيه: الكمية أكبر من المتاح — سيصبح الرصيد '+m(after)+' بالسالب','#d97706')}
function notes(id){const c=cust(id);modal(`<h3>📝 ملاحظات — ${E(c.n)}</h3><textarea id="nt" rows="6" placeholder="اكتب ملاحظة..." style="width:100%;padding:11px;border:1.5px solid var(--bd);border-radius:10px;font:inherit;margin-bottom:8px"></textarea><button class="b n" onclick="addNote(${id})">إضافة الملاحظة بتاريخ اليوم</button><div style="max-height:45vh;overflow:auto">${(c.notes||[]).slice().reverse().map(n=>`<div class="cd" style="margin:0 0 8px;padding:10px"><div class="mu">🕒 ${new Date(n.ts).toLocaleString('ar-EG')}</div><pre>${E(n.t)}</pre></div>`).join('')||'<p class="mu">لا توجد ملاحظات بعد</p>'}</div>`)}
function addNote(id){const t=val('nt').trim();if(!t)return alert('اكتب الملاحظة أولاً');const c=cust(id);(c.notes=c.notes||[]).push({ts:Date.now(),t});save();render();notes(id);toast('تم حفظ الملاحظة')}
/* ===== v6: أنواع لكل قسم + توريد بمتوسط التكلفة + ديون وأرباح أذكى ===== */
function vInv(){const lg=db.prods.filter(p=>!p.k);
return card('📦 المواد الأساسية','<div class="g2">'+MT.map(([k,n,e])=>{const L=db.prods.filter(p=>p.k==k),a=sum(L,p=>p.qty-(p.res||0)),bad=L.some(p=>p.qty-(p.res||0)<0||p.qty<=db.shop.low);
return `<button class="b" style="padding:20px 6px;font-size:17px;${L.length?'':'background:#6b7280'}" onclick="catView('${k}')">${e}<br>${n}<br><small style="${bad?'color:#fecaca':''}">${L.length?L.length+' نوع — متاح '+m(a):'اضغط للإضافة'}</small>${L.some(p=>p.qty-(p.res||0)<0)?'<br>🛑':''}</button>`}).join('')+'</div>')
+'<button class="b a" onclick="rsvDash()">📋 عرض الحجوزات</button>'
+(lg.length?card('منتجات قديمة',lg.map(p=>`<div class="row"><span>${E(p.n)} — ${m(p.qty)}</span><button class="b s r" onclick="pin(()=>delP(${p.id}))">حذف</button></div>`).join('')):'')}
function catView(k){const t=MT.find(a=>a[0]==k),L=db.prods.filter(p=>p.k==k);
modal(`<h3>${t[2]} ${t[1]}</h3><button class="b n" onclick="typeForm('${k}')">➕ إضافة نوع جديد</button>`+(L.map(p=>{const a=p.qty-(p.res||0);return `<div class="row" style="cursor:pointer" onclick="typeForm('${k}',${p.id})"><span>${E(p.tn||t[1])}</span><span>${a<0?`<span onclick="event.stopPropagation();why(${p.id})">🛑</span> `:''}<b class="${a<0?'low':''}">${m(a)}</b> ${E(p.units[0].n)}${p.res?` <span class="mu">(محجوز ${m(p.res)})</span>`:''}</span></div>`}).join('')||'<p class="mu">لا توجد أنواع بعد</p>'))}
function typeForm(k,id){const t=MT.find(a=>a[0]==k),p=id?prod(id):null;window._mu=p?p.units[0].n:t[3][0];
modal(`<h3>${t[2]} ${t[1]} — ${p?'تعديل نوع':'نوع جديد'}</h3><input id="tyn" placeholder="اسم النوع (مثال: أسيوط، السويس)" value="${E(p&&p.tn||'')}"><div class="mu">وحدة البيع</div><div class="g2">${t[3].map(x=>`<button class="b s ${x==_mu?'':'g'}" onclick="_mu='${x}';[...this.parentNode.children].forEach(b=>b.classList.add('g'));this.classList.remove('g')">${x}</button>`).join('')}</div>
<div class="mu">سعر الشراء (التكلفة) — سري ولا يظهر في الفاتورة</div><input id="mtc" type="number" min="0" step="any" value="${p&&p.cost!=null?p.cost:''}"><div class="mu">الكمية الفعلية بالمخزن</div><input id="mtq" type="number" step="any" value="${p?p.qty:''}">
<button class="b n" onclick="saveType('${k}',${id||0})">حفظ</button>`+(p?`<h3 style="margin-top:12px">➕ توريد كمية جديدة (يُحسب متوسط التكلفة تلقائياً)</h3><div class="g2"><input id="rsk" type="number" min="0" step="any" placeholder="الكمية"><input id="rsc" type="number" min="0" step="any" placeholder="سعر الشراء"></div><button class="b a" onclick="restock(${id},'${k}')">توريد</button><button class="b r" onclick="pin(()=>delType(${id},'${k}'))">🗑️ حذف المنتج نهائياً</button>`:'')+`<button class="b g" onclick="catView('${k}')">↩ رجوع لأنواع ${t[1]}</button>`)}
function saveType(k,id){const c=val('mtc'),q=val('mtq'),tn=val('tyn').trim(),t=MT.find(a=>a[0]==k),L=db.prods.filter(p=>p.k==k);
if(c==='')return alert('سعر الشراء إلزامي');if(+c<0)return alert('لا يُسمح بقيم سالبة');if(!tn&&!id&&L.length)return alert('اكتب اسم النوع لتمييزه عن الأنواع الأخرى');if(tn&&L.some(p=>p.id!=id&&p.tn==tn))return alert('هذا النوع موجود بالفعل');
let p=id?prod(id):null;if(!p){p={id:db.seq++,k,cat:t[1],bc:'',res:0,qty:0,units:[]};db.prods.push(p)}
p.tn=tn;p.n=t[1]+(tn?' '+tn:'');p.units=[{n:_mu,f:1}];p.cost=+c;if(q!=='')p.qty=+q;save();render();toast('تم الحفظ');catView(k)}
function restock(id,k){const p=prod(id),q=+val('rsk'),c=val('rsc');if(!(q>0)||c===''||+c<0)return alert('أدخل الكمية وسعر الشراء');
const b=Math.max(p.qty,0);p.cost=p.cost==null?+c:(b*p.cost+q*+c)/(b+q);p.qty+=q;(p.buys=p.buys||[]).push({ts:Date.now(),q,c:+c});db.log.push({ts:Date.now(),k:'توريد',t:`${p.n} × ${q} بسعر ${m(+c)}`});save();render();toast('تم التوريد — متوسط التكلفة الجديد '+m(p.cost));typeForm(k,id)}
function delType(id,k){if(db.rsv.some(r=>r.pid==id&&r.q>r.drawn))return alert('توجد حجوزات معلّقة على هذا النوع');db.prods=db.prods.filter(p=>p.id!=id);save();render();toast('تم حذف المنتج نهائياً');catView(k)}

/* --- الحجوزات مرتبطة بالعميل --- */
function rsvDash(cid){const L=db.rsv.filter(r=>!cid||r.c==cid);modal('<h3>📋 الحجوزات'+(cid?' — '+E(cn(cid)):'')+'</h3><div style="overflow:auto"><table style="width:100%;font-size:12px;text-align:right"><tr><th>العميل</th><th>المادة</th><th>المتبقي</th><th>المسحوب</th><th>العربون</th><th>قيمة المتبقي</th><th>الانتهاء</th><th>توريد</th></tr>'+(L.map(r=>{const l=r.q-r.drawn;return `<tr><td>${E(cn(r.c))}</td><td>${E(pn(r.pid))}</td><td>${m(l)}</td><td>${m(r.drawn)}</td><td>${m((r.dep||0)-(r.used||0))}</td><td>${m(l*r.price)}</td><td>${r.exp}${r.closed?' <span class="tag">فُكّ</span>':''}</td><td>${l>0?`<input id="dl${r.id}" type="number" min="0" style="width:60px;margin:0"><button class="b s" onclick="dlv(${r.id},${cid||0})">✔</button>`:'✓'}</td></tr>`}).join('')||'<tr><td colspan="8">لا توجد حجوزات</td></tr>')+'</table></div>')}
function cSum(x){const rs=db.rsv.filter(r=>r.c==x.id&&r.q>r.drawn),rv=sum(rs,r=>(r.q-r.drawn)*r.price),dp=sum(rs,r=>(r.dep||0)-(r.used||0)),late=x.due&&x.bal>0&&x.due<today(),old=db.inv.filter(i=>i.c==x.id&&(i.rem||0)>0).sort((a,b)=>a.ts-b.ts)[0];
return `<div class="${x.bal>0?'low':''}">الدين عليه: <b>${m(x.bal)}</b>${late?' <span class="tag">متأخر عن '+x.due+'</span>':''}${x.bal>0&&old?` <span class="mu">(أقدم فاتورة منذ ${Math.floor((Date.now()-old.ts)/864e5)} يوم)</span>`:''}</div>${x.cr?`<div>رصيد دائن له: <b>${m(x.cr)}</b></div>`:''}${rs.length?`<div class="mu">حجوزات معلّقة: ${rs.length} بقيمة ${m(rv)} — عربون محتجز ${m(dp)} — يتبقى تحصيله ${m(Math.max(0,rv-dp))}</div>`:''}`}

/* --- سداد الدين يُوزَّع تلقائياً على أقدم الفواتير --- */
function collect(id){const a=+val('am'+id),c=cust(id);if(!(a>0))return alert('أدخل مبلغاً صحيحاً');const ap=Math.min(a,c.bal),cr=a-ap,ts=Date.now();let left=ap;const al=[];
db.inv.filter(i=>i.c==id&&(i.rem||0)>0).sort((x,y)=>x.ts-y.ts).forEach(i=>{if(left<=0)return;const u=Math.min(left,i.rem);i.rem-=u;i.paid+=u;left-=u;al.push({inv:i.id,amt:u})});
c.bal-=ap;c.cr=(c.cr||0)+cr;db.pay.push({id:db.seq++,ts,day:today(),c:id,amt:a,ap,cr,al});db.cf.push({id:db.seq++,ts,day:today(),k:'pay',m:'cash',amt:a});save();sched();
txt('وصل استلام',`${db.shop.n}\nالتاريخ: ${today()}\nاستلمنا من: ${c.n}\nمبلغ: ${m(a)}${al.length?'\nسُدِّد من الفواتير: '+al.map(x=>'#'+x.inv+' ('+m(x.amt)+')').join('، '):''}${cr?'\n(منه '+m(cr)+' رصيد دائن)':''}\nالمتبقي عليه: ${m(c.bal)}`);render()}

/* --- أرباح أذكى: محقق/محبوس/هامش/أقسام/متوقع --- */
function prof(f,t){let p=0,u=0,rv=0,re=0;const by={};db.inv.filter(i=>i.ts>f&&i.ts<=t).forEach(i=>{const kk=i.k!=null?i.k:(i.s?(i.s-i.d)/i.s:1);let ip=0;
i.items.forEach(x=>{if(x.cost==null){u++;return}const q=x.q-x.r,g=q*(x.pr*kk-x.cost),ct=(prod(x.pid)||{}).cat||x.n,b=by[ct]=by[ct]||{p:0,s:0};b.p+=g;b.s+=q*x.pr*kk;ip+=g;rv+=q*x.pr*kk});
p+=ip;re+=ip*(i.tot>0?Math.max(0,Math.min(1,(i.tot-(i.rem||0))/i.tot)):1)});return{p,u,real:re,hold:p-re,mg:rv?p/rv*100:0,by}}
function bk(){const mo=new Date();mo.setDate(1);mo.setHours(0,0,0,0);const r=prof(mo.getTime()-1,Date.now()),ex=sum(db.rsv.filter(x=>x.q>x.drawn),x=>{const p=prod(x.pid);return p&&p.cost!=null?(x.q-x.drawn)*(x.price-p.cost):0});
return '<h3 style="margin-top:12px">ربح الشهر حسب القسم</h3>'+(Object.keys(r.by).map(c=>`<div class="row"><span>${E(c)}</span><b>${m(r.by[c].p)}</b></div>`).join('')||'<p class="mu">—</p>')+`<div class="row"><span>⏳ ربح متوقع من حجوزات معلّقة</span><b>${m(ex)}</b></div>`}
function dbt(){const L=db.cust.filter(c=>c.bal>0).sort((a,b)=>b.bal-a.bal),late=L.filter(c=>c.due&&c.due<today());
return `<div class="row"><span>إجمالي الديون</span><b class="low">${m(sum(L,c=>c.bal))}</b></div><div class="row"><span>أرصدة دائنة للعملاء</span><b>${m(sum(db.cust,c=>c.cr||0))}</b></div><div class="row"><span>متأخرون عن موعد السداد</span><b>${late.length}</b></div>`+L.slice(0,8).map(c=>`<div class="row"><span>${E(c.n)} ${c.due&&c.due<today()?'<span class="tag">متأخر</span>':''}</span><b>${m(c.bal)}</b></div>`).join('')}
setInterval(relExp,36e5);relExp();go('cash');perm();sched(1);
</script></body></html>
